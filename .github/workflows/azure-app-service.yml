name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: 6.0.x
  AZURE_WEBAPP_PACKAGE_PATH: publish

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/VRSimulator.Api/VRSimulator.Api.csproj

      - name: Build
        run: dotnet build src/VRSimulator.Api/VRSimulator.Api.csproj --configuration Release --no-restore

      - name: Publish backend
        run: dotnet publish src/VRSimulator.Api/VRSimulator.Api.csproj --configuration Release --no-build --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Add frontend files
        run: |
          mkdir -p ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/wwwroot
          cp index.html pricing.html certificates.html login.html platform.html verify.html worker.html ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/wwwroot/
          cp styles.css script.js ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/wwwroot/
          cp -R assets ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/wwwroot/assets

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
