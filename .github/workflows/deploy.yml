name: Deploy to App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check deployment settings
        run: |
          if [ -z "${{ vars.AZURE_WEBAPP_NAME }}" ]; then
            echo "Missing GitHub Actions variable: AZURE_WEBAPP_NAME"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "Missing GitHub Actions secret: AZURE_CLIENT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
            echo "Missing GitHub Actions secret: AZURE_TENANT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "Missing GitHub Actions secret: AZURE_SUBSCRIPTION_ID"
            exit 1
          fi
          if [ -z "${{ secrets.SQL_CONNECTION_STRING }}" ]; then
            echo "Missing GitHub Actions secret: SQL_CONNECTION_STRING"
            exit 1
          fi

      - run: dotnet restore src/VRAcademy.Api/VRAcademy.Api.csproj
      - run: dotnet build src/VRAcademy.Api/VRAcademy.Api.csproj --configuration Release --no-restore

      - name: Run EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          for attempt in 1 2 3 4 5; do
            if dotnet ef database update --project src/VRAcademy.Api/VRAcademy.Api.csproj --startup-project src/VRAcademy.Api/VRAcademy.Api.csproj --connection "${{ secrets.SQL_CONNECTION_STRING }}"; then
              exit 0
            fi

            echo "EF migration attempt $attempt failed. Waiting before retry..."
            sleep 30
          done

          dotnet ef database update --project src/VRAcademy.Api/VRAcademy.Api.csproj --startup-project src/VRAcademy.Api/VRAcademy.Api.csproj --connection "${{ secrets.SQL_CONNECTION_STRING }}"

      - run: dotnet publish src/VRAcademy.Api/VRAcademy.Api.csproj -c Release -o publish_output --no-build

      - name: Add frontend files
        run: |
          mkdir -p publish_output/wwwroot
          cp index.html pricing.html certificates.html certificate-view.html login.html platform.html platform-workers.html platform-training.html platform-assigned-training.html platform-certificates.html platform-account.html system-admin.html system-company.html verify.html worker.html publish_output/wwwroot/
          cp styles.css script.js publish_output/wwwroot/
          cp -R assets publish_output/wwwroot/assets

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service settings
        run: |
          resource_group=$(az webapp list --query "[?name=='${{ vars.AZURE_WEBAPP_NAME }}'].resourceGroup | [0]" -o tsv)
          if [ -z "$resource_group" ]; then
            echo "Unable to find resource group for App Service '${{ vars.AZURE_WEBAPP_NAME }}'."
            exit 1
          fi

          az webapp config appsettings set \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "$resource_group" \
            --settings \
              "AZURE_SQL_CONNECTION_STRING=${{ secrets.SQL_CONNECTION_STRING }}" \
              "ConnectionStrings__TrainingDatabase=${{ secrets.SQL_CONNECTION_STRING }}" \
              "Database__Provider=SqlServer" \
              "Database__FallbackToInMemory=false"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish_output
